services:
  postgres:
    image: postgres:17
    container_name: tradingagents-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradingpass}
      POSTGRES_DB: ${POSTGRES_DB:-tradingagents}
    ports:
      - "5432:5432"
    volumes:
      - tradingagents_pgdata:/var/lib/postgresql/data

volumes:
  tradingagents_pgdata:
