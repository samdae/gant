<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 인증 · GANT</title>
    <style>
      :root {
        --bg: #f8f9fb;
        --bg-subtle: #ffffff;
        --surface: #ffffff;
        --surface-hover: #f1f3f5;
        --border: rgba(0, 0, 0, 0.08);
        --border-strong: rgba(0, 0, 0, 0.12);
        --text: #1a1a2e;
        --text-secondary: #4a4a68;
        --text-dim: #8e8ea0;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --primary-bg: rgba(99, 102, 241, 0.08);
        --loss: #e11d48;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.04);
        --radius: 14px;
        --radius-sm: 10px;
        --transition: 0.18s ease;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 22px;
      }

      .header {
        margin-bottom: 16px;
      }

      .title {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      label {
        display: block;
        font-size: 0.8125rem;
        color: var(--text-secondary);
        margin: 14px 0 8px;
      }

      input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        background: var(--bg-subtle);
        color: var(--text);
        outline: none;
        transition: var(--transition);
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
      }

      .status {
        margin-top: 10px;
        font-size: 0.8125rem;
        color: var(--loss);
        min-height: 18px;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 18px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
      }

      .btn-ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
      }

      .btn-ghost:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .btn-primary {
        background: var(--primary);
        color: #ffffff;
      }

      .btn-primary:hover {
        background: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="title">관리자 인증</div>
      </div>

      <label for="tokenInput">관리자 토큰</label>
      <input
        id="tokenInput"
        type="password"
        autocomplete="off"
      />
      <div class="status" id="statusMsg"></div>

      <div class="actions">
        <button class="btn btn-ghost" id="cancelBtn">취소</button>
        <button class="btn btn-primary" id="saveBtn">저장</button>
      </div>

    </div>

    <script>
      const tokenInput = document.getElementById("tokenInput");
      const statusMsg = document.getElementById("statusMsg");
      const saveBtn = document.getElementById("saveBtn");
      const cancelBtn = document.getElementById("cancelBtn");

      function resolveReturnTarget() {
        const params = new URLSearchParams(window.location.search);
        const returnTo = params.get("return");
        if (returnTo && returnTo.startsWith("#/")) {
          return `index.html${returnTo}`;
        }
        if (returnTo && returnTo.startsWith("/")) {
          return returnTo;
        }
        return "index.html#/";
      }

      saveBtn.addEventListener("click", () => {
        const token = tokenInput.value.trim();
        if (!token) {
          statusMsg.textContent = "토큰을 입력해 주세요.";
          return;
        }
        localStorage.setItem("gant_admin_token", token);
        window.location.href = resolveReturnTarget();
      });

      cancelBtn.addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "index.html#/";
        }
      });
    </script>
  </body>
</html>
